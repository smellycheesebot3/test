    <script>
        // Track race records
        let currentLapTime = 0;
        let bestLapTime = Infinity;
        let raceActive = false;
        let lastPassedGate = -1;
        let totalLapsCompleted = 0;

        // OSD elements injection for lap times
        const osdBottom = document.getElementById('osd-bottom');
        osdBottom.innerHTML = `
            <span>BAT: 4.20V (6S)</span>
            <span id="lap-timer" style="color: #ffff00;">LAP: 0.00s</span>
            <span id="best-lap" style="color: #00ffff;">BEST: --:--</span>
        `;

        // Extend the baseline physics frame hook to track race configurations
        const originalUpdatePhysics = updatePhysics;
        updatePhysics = function(dt) {
            originalUpdatePhysics(dt);
            
            if (drone.throttle > 5 && !raceActive) {
                raceActive = true;
            }

            if (raceActive) {
                currentLapTime += dt;
                document.getElementById('lap-timer').innerText = `LAP: ${currentLapTime.toFixed(2)}s`;
                checkGateCollisions();
            }
            
            checkCrashConditions();
        };

        function checkGateCollisions() {
            // Primitive bounding box collision calculations for course gate checkin points
            let gatePositions = [
                new THREE.Vector3(0, 4, -40),
                new THREE.Vector3(40, 4, -80),
                new THREE.Vector3(0, 4, -120),
                new THREE.Vector3(-40, 4, -60)
            ];

            gatePositions.forEach((gateCenter, index) => {
                let dist = drone.pos.distanceTo(gateCenter);
                // When quad matches proximity threshold
                if (dist < 6) {
                    if (index === 0 && lastPassedGate === gatePositions.length - 1) {
                        // Completed a full lap loop sequence
                        totalLapsCompleted++;
                        if (currentLapTime < bestLapTime) {
                            bestLapTime = currentLapTime;
                            document.getElementById('best-lap').innerText = `BEST: ${bestLapTime.toFixed(2)}s`;
                        }
                        currentLapTime = 0;
                        flashOSD('#00ff00');
                    }
                    lastPassedGate = index;
                }
            });
        }

        function checkCrashConditions() {
            // Ground impact penalty matrix or high-velocity threshold breaks
            if (drone.pos.y <= 0.15 && drone.vel.length() > 8) {
                flashOSD('#ff0000');
                reset();
                currentLapTime = 0;
                raceActive = false;
            }
        }

        function flashOSD(color) {
            const osd = document.getElementById('osd');
            osd.style.boxShadow = `inset 0 0 80px ${color}`;
            setTimeout(() => {
                osd.style.boxShadow = 'none';
            }, 300);
        }
    </script>

    <script>
        let gamepadIndex = null;

        // Custom Transmitter Channel Mapping (Betaflight Style)
        const RC_CHANNELS = {
            roll: 0,      // Left Stick Horizontal (Acro Roll)
            pitch: 1,     // Left Stick Vertical (Acro Pitch)
            yaw: 2,       // Right Stick Horizontal (Yaw)
            throttle: 3   // Right Stick Vertical (Throttle Axis)
        };

        // Scan and capture active gamepad profiles
        window.addEventListener("gamepadconnected", (e) => {
            gamepadIndex = e.gamepad.index;
            updateOSDMessage("🏆 RADIO CONNECTED: " + e.gamepad.id.substring(0, 15));
            flashOSD('#00ffff');
        });

        window.addEventListener("gamepaddisconnected", (e) => {
            if (gamepadIndex === e.gamepad.index) {
                gamepadIndex = null;
                updateOSDMessage("⚠️ CONTROLLER DISCONNECTED");
                flashOSD('#ff5500');
            }
        });

        // Intercept standard input loops to layer radio data overrides
        const baseUpdatePhysics = updatePhysics;
        updatePhysics = function(dt) {
            if (gamepadIndex !== null) {
                const gp = navigator.getGamepads()[gamepadIndex];
                if (gp) {
                    handleRadioInputs(gp, dt);
                }
            }
            baseUpdatePhysics(dt);
        };

        function handleRadioInputs(gp, dt) {
            // 1. Throttle Processing (Maps axis variance scale -1 to 1 directly to 0-100%)
            let rawThrottle = gp.axes[RC_CHANNELS.throttle];
            // Invert axis values if the radio registers down-stick as negative values
            let invertedThrottle = (1 - rawThrottle) / 2; 
            drone.throttle = invertedThrottle * 100;

            // 2. Multiaxis Directional Rate Calculations (Applies deadzone filtering)
            const deadzone = 0.05;
            
            let rawRoll = gp.axes[RC_CHANNELS.roll];
            let rawPitch = gp.axes[RC_CHANNELS.pitch];
            let rawYaw = gp.axes[RC_CHANNELS.yaw];

            if (flightMode === 'acro') {
                drone.angVel.z = Math.abs(rawRoll) > deadzone ? -rawRoll * RATES.roll : 0;
                drone.angVel.x = Math.abs(rawPitch) > deadzone ? rawPitch * RATES.pitch : 0;
            } else {
                let targetPitch = Math.abs(rawPitch) > deadzone ? rawPitch * 0.6 : 0;
                let targetRoll = Math.abs(rawRoll) > deadzone ? -rawRoll * 0.6 : 0;
                drone.angVel.x = (targetPitch - drone.rot.x) * 8.0;
                drone.angVel.z = (targetRoll - drone.rot.z) * 8.0;
            }

            drone.angVel.y = Math.abs(rawYaw) > deadzone ? -rawYaw * RATES.yaw : 0;

            // 3. Hardware Button Actions (Map Button 0 to instantly invoke system resets)
            if (gp.buttons[0] && gp.buttons[0].pressed) {
                reset();
                currentLapTime = 0;
                raceActive = false;
            }
        }

        function updateOSDMessage(msg) {
            const osdCenter = document.getElementById('osd-center');
            osdCenter.innerText = msg;
            osdCenter.style.fontSize = "16px";
            setTimeout(() => {
                osdCenter.innerText = "+";
                osdCenter.style.fontSize = "24px";
            }, 3000);
        }
    </script>

    <script>
        let audioCtx = null;
        let mainOsc = null;
        let gainNode = null;
        let audioInitialized = false;

        function initAudio() {
            if (audioInitialized) return;
            
            try {
                // Initialize the Web Audio API context
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                
                // Create a sawtooth oscillator to simulate realistic motor/propeller buzz
                mainOsc = audioCtx.createOscillator();
                mainOsc.type = 'sawtooth';
                
                // Create gain control node to manage dynamic motor volume spikes
                gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                
                // Link nodes together to build the output matrix path
                mainOsc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                mainOsc.start();
                audioInitialized = true;
            } catch (e) {
                console.error("Web Audio API failed to load:", e);
            }
        }

        // Attach initialization trigger to the start button action layout
        document.getElementById('b-str').addEventListener('click', () => {
            initAudio();
        });

        // Intercept baseline loop system processing to map active engine sounds
        const baseAudioUpdatePhysics = updatePhysics;
        updatePhysics = function(dt) {
            baseAudioUpdatePhysics(dt);
            if (audioInitialized && audioCtx) {
                updateMotorSound();
            }
        };

        function updateMotorSound() {
            // Avoid sudden pops by calculating smooth audio timeline transitions
            const targetTime = audioCtx.currentTime + 0.05;
            
            // Map throttle percentage to real-time audio pitch frequencies
            // Lower limit (0% Throttle) = 60Hz idle rumble
            // Upper limit (100% Throttle) = 450Hz screaming quad whine
            const targetFrequency = 60 + (drone.throttle / 100) * 390;
            mainOsc.frequency.setTargetAtTime(targetFrequency, audioCtx.currentTime, 0.03);
            
            // Scale gain volume curve smoothly so the motors stay quiet at idle
            let targetVolume = (drone.throttle / 100) * 0.15;
            if (drone.throttle <= 1) targetVolume = 0.01; // Low level ambient idle buzz
            
            gainNode.gain.setTargetAtTime(targetVolume, audioCtx.currentTime, 0.03);
        }

        // Kill audio stream execution paths if drone crashes out hard
        const baseAudioReset = reset;
        reset = function() {
            baseAudioReset();
            if (audioInitialized && gainNode) {
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            }
        };
    </script>

    <script>
        // Track generated obstacles for potential hit detection expansion
        let obstacleMeshes = [];

        // Extend world building to inject custom structures and obstacles
        const baseBuildWorld = buildWorld;
        buildWorld = function() {
            baseBuildWorld();
            generateObstacleField();
        };

        function generateObstacleField() {
            // 1. Generate Skyscrapers/Concrete Pillars around the perimeter
            const buildingMat = new THREE.MeshStandardMaterial({ 
                color: 0x222831, 
                roughness: 0.7,
                metalness: 0.2
            });

            for (let i = 0; i < 15; i++) {
                // Random position away from the center spawn point
                let radius = 120 + Math.random() * 150;
                let angle = Math.random() * Math.PI * 2;
                let x = Math.cos(angle) * radius;
                let z = Math.sin(angle) * radius;

                let w = 15 + Math.random() * 20;
                let h = 40 + Math.random() * 60;
                let d = 15 + Math.random() * 20;

                let boxGeo = new THREE.BoxGeometry(w, h, d);
                let building = new THREE.Mesh(boxGeo, buildingMat);
                
                building.position.set(x, h / 2, z);
                scene.add(building);
                obstacleMeshes.push(building);
            }

            // 2. Generate Slalom Cones/Pylons within the inner circuit
            const pylonMat = new THREE.MeshStandardMaterial({ color: 0x393e46, roughness: 0.5 });
            const tipMat = new THREE.MeshStandardMaterial({ color: 0x00adb5, emissive: 0x00adb5, emissiveIntensity: 0.5 });
            
            const pylonCoords = [
                {x: 20, z: -20}, {x: -20, z: -90}, {x: 20, z: -140}, {x: -60, z: -100}
            ];

            pylonCoords.forEach(coord => {
                let pylonGroup = new THREE.Group();
                pylonGroup.position.set(coord.x, 0, coord.z);

                // Base cylinder cone section
                let baseGeo = new THREE.CylinderGeometry(0.5, 2, 12, 6);
                let baseMesh = new THREE.Mesh(baseGeo, pylonMat);
                baseMesh.position.y = 6;
                pylonGroup.add(baseMesh);

                // Glowing neon tip section for night/low-vis style marks
                let tipGeo = new THREE.CylinderGeometry(0.1, 0.6, 3, 6);
                let tipMesh = new THREE.Mesh(tipGeo, tipMat);
                tipMesh.position.y = 13.5;
                pylonGroup.add(tipMesh);

                scene.add(pylonGroup);
                obstacleMeshes.push(baseMesh); // Add base reference for physics calculations
            });
        }

        // Intercept core physics execution stack to process structure collision penalties
        const baseObstacleUpdatePhysics = updatePhysics;
        updatePhysics = function(dt) {
            baseObstacleUpdatePhysics(dt);
            checkObstacleCollisions();
        };

        function checkObstacleCollisions() {
            // Basic cylinder/radial bounding checks for simple structural barriers
            obstacleMeshes.forEach(mesh => {
                let tempPos = new THREE.Vector3();
                mesh.getWorldPosition(tempPos);

                // Quick horizontal plane check
                let horizontalDist = Math.sqrt(
                    Math.pow(drone.pos.x - tempPos.x, 2) + 
                    Math.pow(drone.pos.z - tempPos.z, 2)
                );

                // Extract geometry bounds safely
                let isBox = mesh.geometry.type === 'BoxGeometry';
                let collisionRadius = isBox ? 12 : 2.5;
                let maxDangerHeight = isBox ? mesh.geometry.parameters.height : 15;

                if (horizontalDist < collisionRadius && drone.pos.y < maxDangerHeight) {
                    // Impact registered against environmental obstacle object mesh structure
                    flashOSD('#ff0055');
                    reset();
                    currentLapTime = 0;
                    raceActive = false;
                }
            });
        }
    </script>

        };

        function applyAnalogStaticInterference() {
            // Analog tracking video feeds break apart when obstacles drop between Tx and Rx
            // We simulate signal drops based on altitude drops or horizontal track ranges
            let distanceToCenter = drone.pos.length();
            
            // Calculate baseline signal degradation modifier profiles
            let altitudePenalty = Math.max(0, (20 - drone.pos.y) * 0.002);
            let distancePenalty = Math.max(0, (distanceToCenter - 100) * 0.0003);
            let rawInterference = 0.04 + altitudePenalty + distancePenalty;

            // Introduce high-frequency random multi-path noise flickers
            if (Math.random() > 0.97) {
                rawInterference += 0.08; // Sudden spike glitch frame drop
            }

            // Clamp max values to prevent total screen blackouts
            let finalNoiseAlpha = Math.min(0.25, rawInterference);

    <script>
        let particles = [];
        const maxParticles = 80;

        // Custom Particle Object Definition Matrix
        class JetParticle {
            constructor(position, color) {
                this.pos = position.clone();
                // Random vector spray offset trailing directly behind the drone's path
                this.vel = new THREE.Vector3(
                    (Math.random() - 0.5) * 2,
                    (Math.random() - 0.5) * 2,
                    (Math.random() - 0.5) * 2
                );
                this.age = 0;
                this.maxAge = 0.5 + Math.random() * 0.4; // Decay time in seconds

                // Setup miniature neon tracking sphere primitives
                let geo = new THREE.SphereGeometry(0.12, 4, 4);
                let mat = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 0.8
                });
                this.mesh = new THREE.Mesh(geo, mat);
                this.mesh.position.copy(this.pos);
                scene.add(this.mesh);
            }

            update(dt) {
                this.age += dt;
                this.pos.addScaledVector(this.vel, dt);
                this.mesh.position.copy(this.pos);
                
                // Fade opacity over time to simulate exhaust dissipation
                this.mesh.material.opacity = 1.0 - (this.age / this.maxAge);
                
                if (this.age >= this.maxAge) {
                    scene.remove(this.mesh);
                    this.mesh.geometry.dispose();
                    this.mesh.material.dispose();
                    return false; // Mark for cleanup
                }
                return true;
            }
        }

        // Intercept standard core physics frames to feed visual trail systems
        const baseParticleUpdatePhysics = updatePhysics;
        updatePhysics = function(dt) {
            baseParticleUpdatePhysics(dt);
            
            // 1. Generate thrust prop wash particles when active throttle matches threshold
            if (drone.throttle > 15 && particles.length < maxParticles) {
                // Calculate position slightly below and behind camera vector array orientation
                let trailOffset = new THREE.Vector3(0, -0.4, 0.8).applyQuaternion(
                    new THREE.Quaternion().setFromEuler(drone.rot)
                );
                let spawnPoint = drone.pos.clone().add(trailOffset);
                
                // Pick exhaust trailing glow profile based on active flight mechanics speed configuration
                let trailColor = drone.throttle > 80 ? 0xff3300 : 0x00ffff;
                particles.push(new JetParticle(spawnPoint, trailColor));
            }

            // 2. Iterate and process particle stack garbage cleanup tasks
            for (let i = particles.length - 1; i >= 0; i--) {
                let alive = particles[i].update(dt);
                if (!alive) {
                    particles.splice(i, 1);
                }
            }
        };

        // Override existing checkpoint collision routines to emit particle rings on success
        const baseGateCheckOverride = checkGateCollisions;
        checkGateCollisions = function() {
            let oldPassedGate = lastPassedGate;
            baseGateCheckOverride();
            
            // If the gate sequence successfully incremented, burst gate fireworks!
            if (lastPassedGate !== oldPassedGate) {
                triggerGateBurstEffect(drone.pos);
            }
        };

        function triggerGateBurstEffect(position) {
            for (let i = 0; i < 30; i++) {
                let burstPoint = position.clone();
                let p = new JetParticle(burstPoint, 0x00ff00);
                // Ramp speed metrics out exponentially to trigger explosive visual pops
                p.vel.multiplyScalar(6);
                p.maxAge = 0.8;
                particles.push(p);
            }
        }
    </script>

    <script>
        // Core battery telemetry variables
        let totalCells = 6;
        let nominalVoltage = 4.20; // Per cell limit
        let currentCellVoltage = 4.20;
        let batteryCapacityMAh = 1300;
        let remainingCapacityMAh = 1300;
        let peakCurrentAmps = 120; // Max current draw at 100% throttle
        
        // Hook baseline physics loops to simulate complex battery physics modeling
        const baseBatteryUpdatePhysics = updatePhysics;
        updatePhysics = function(dt) {
            if (remainingCapacityMAh > 0) {
                // 1. Calculate active real-time current draw based on your current throttle position
                let idleCurrent = 2.5; // Baseline electronics power draw
                let activeCurrentDraw = idleCurrent + (drone.throttle / 100) * (peakCurrentAmps - idleCurrent);
                
                // 2. Consume capacity over time delta (Amps * hours conversion)
                let consumedMAh = (activeCurrentDraw * 1000) * (dt / 3600);
                remainingCapacityMAh = Math.max(0, remainingCapacityMAh - consumedMAh);
                
                // 3. Model True Internal Resistance Voltage Sag (V = IR)
                // Pushing full throttle forces an immediate, temporary drop in cell performance
                let internalResistance = 0.004; // Ohms per cell
                let instantaneousSag = activeCurrentDraw * internalResistance;
                
                // 4. Model Linear Capacity Discharge Curve
                let capacityPercentage = remainingCapacityMAh / batteryCapacityMAh;
                let restedCellVoltage = 3.5 + (capacityPercentage * 0.7); // Discharges down from 4.20V to 3.50V base
                
                // Final actual running voltage under current load conditions
                currentCellVoltage = Math.max(3.2, restedCellVoltage - instantaneousSag);
                
                // 5. Dynamic Power Output Degradation Performance Limiter
                // As the overall system voltage sags, max thrust capability is choked down
                let powerEfficiencyFactor = (currentCellVoltage / nominalVoltage);
                // Dynamically modify the engine's thrust capacity parameter mid-flight
                MAX_THRUST = 25 * Math.pow(powerEfficiencyFactor, 1.8);
                
                // 6. Low Battery Alerts
                if (currentCellVoltage < 3.5) {
                    // Flash low battery warnings directly across your central HUD layout
                    if (Math.floor(clock.getElapsedTime() * 4) % 2 === 0) {
                        document.getElementById('v-thr').parentElement.style.color = '#ff3300';
                    }
                } else {
                    document.getElementById('v-thr').parentElement.style.color = '#00ff00';
                }
            } else {
                // Out of battery! Cut all engine output completely
                drone.throttle = 0;
                MAX_THRUST = 0;
                currentCellVoltage = 3.0;
            }
            
            // Invoke the next steps in the physics pipeline chain
            baseBatteryUpdatePhysics(dt);
            
            // 7. Update Telemetry Screen Readouts
            let totalPackVoltage = (currentCellVoltage * totalCells).toFixed(1);
            let capacityRemainingPercent = Math.round((remainingCapacityMAh / batteryCapacityMAh) * 100);
            
            // Locate the bottom tracking bar inside your dashboard overlay interface
            const osdBottomSpan = document.getElementById('osd-bottom').children[0];
            osdBottomSpan.innerText = `BAT: ${totalPackVoltage}V [${capacityRemainingPercent}%]`;
            if (currentCellVoltage < 3.5) {
                osdBottomSpan.style.color = '#ff3300';
                osdBottomSpan.style.fontWeight = 'bold';
            } else {
                osdBottomSpan.style.color = '#00ff00';
                osdBottomSpan.style.fontWeight = 'normal';
            }
        }

        // Reset your battery parameters alongside structural drone crash matrices
        const baseBatteryReset = reset;
        reset = function() {
            baseBatteryReset();
            // Automatically swap in a freshly charged pack when resetting your position
            remainingCapacityMAh = batteryCapacityMAh;
            currentCellVoltage = nominalVoltage;
            MAX_THRUST = 25;
        }
    </script>
