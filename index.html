<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>StreamHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    header {
      background: #000;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .logo span {
      color: #ff9900;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      margin-left: 15px;
      font-size: 14px;
    }

    nav a:hover {
      color: #ff9900;
    }

    .search-bar {
      margin-left: 20px;
    }

    .search-bar input {
      padding: 5px 10px;
      border-radius: 3px;
      border: none;
    }

    main {
      padding: 20px;
    }

    .section-title {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
    }

    .video-card {
      background: #1a1a1a;
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .video-card:hover {
      transform: translateY(-3px);
    }

    .thumb {
      background: #333;
      height: 100px;
    }

    .video-info {
      padding: 8px 10px;
      font-size: 13px;
    }

    .video-title {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .video-meta {
      color: #aaa;
      font-size: 11px;
    }

    footer {
      padding: 15px 20px;
      font-size: 12px;
      color: #777;
      background: #000;
      text-align: center;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Stream<span>Hub</span></div>
    <div class="search-bar">
      <input type="text" placeholder="Search videos..." />
    </div>
    <nav>
      <a href="#">Home</a>
      <a href="#">Categories</a>
      <a href="#">Trending</a>
      <a href="#">Login</a>
      <a href="#">Sign Up</a>
    </nav>
  </header>

  <main>
    <div class="section-title">Trending Videos</div>
    <div class="video-grid">
      <div class="video-card">
        <div class="thumb"></div>
        <div class="video-info">
          <div class="video-title">Sample Video 1</div>
          <div class="video-meta">1.2M views · 10 min</div>
        </div>
      </div>

      <div class="video-card">
        <div class="thumb"></div>
        <div class="video-info">
          <div class="video-title">Sample Video 2</div>
          <div class="video-meta">532K views · 7 min</div>
        </div>
      </div>

      <div class="video-card">
        <div class="thumb"></div>
        <div class="video-info">
          <div class="video-title">Sample Video 3</div>
          <div class="video-meta">98K views · 4 min</div>
        </div>
      </div>

      <!-- Duplicate video-card blocks as needed -->
    </div>
  </main>

  <footer>
    © 2026 StreamHub · Terms · Privacy · Help
  </footer>
</body>
</html>
